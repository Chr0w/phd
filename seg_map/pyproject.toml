[project]
name = "seg_map"
version = "0.1.0"
description = "Segmentation map Isaac Sim extension"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pylsp-mypy>=1.0.0",
    "python-lsp-server[all]>=1.7.0",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
